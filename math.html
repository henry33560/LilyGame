<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Animal Math Park</title>
<style>
:root{--bg:#FFF8EE;--ink:#3B2A20;--soft:#8A7A6E;--line:#EADFCF;--u:26px;--tw:70px;--cs:96px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","Nunito","Varela Round",ui-rounded,"Trebuchet MS","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation;background:none;padding:0}
#app{min-height:100vh;display:flex;flex-direction:column}
svg{display:block}

/* home */
.title{font-size:clamp(32px,6vw,54px);text-align:center;margin:22px 0 4px;letter-spacing:1px}
.hosts{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.mini{width:clamp(54px,9vw,78px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;padding:14px 22px 10px;max-width:1100px;margin:0 auto;width:100%}
.card{border-radius:28px;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.cicon{width:110px;height:110px;display:grid;place-items:center}
.cicon svg{width:100%;height:100%}
.four{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100px}
.cname{font-size:28px;font-weight:bold}
.bar{width:80%;height:14px;background:rgba(255,255,255,.8);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#7BC67E;border-radius:9px}
.cnum{font-size:18px;color:var(--soft)}
.grown{display:flex;justify-content:center;gap:10px;margin:18px auto 26px}
.reset{font-size:16px;color:#A89A8C;padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.7)}
.vpanel{background:#fff;border-radius:28px;padding:22px;width:min(560px,92vw);max-height:88vh;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);text-align:center}
.vpanel h3{margin:0;font-size:26px}
.vrate{display:flex;gap:10px;justify-content:center}
.vr{padding:10px 16px;border-radius:14px;background:#F4EEE5;font-size:18px}
.vr.on,.vrow.on{background:#DFF3D8;box-shadow:0 0 0 3px #7BC67E}
.vlist{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px;flex:1}
.vrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:#F8F4EE;text-align:left;font-size:18px}
.vrow span{flex:1}.vrow small{color:var(--soft)}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.iconbtn{width:58px;height:58px;border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--line);font-size:28px;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lvl,.lvTitle{font-size:26px;font-weight:bold}
.lvTitle{flex:1;text-align:center;font-size:32px}
.rdots{flex:1;display:flex;justify-content:center;gap:10px}
.rdots i{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.rdots i.on{background:#7BC67E;border-color:#7BC67E}

/* level grid */
.lvGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:10px 22px 30px;max-width:760px;margin:0 auto;width:100%}
.lv{aspect-ratio:1;border-radius:22px;background:#fff;font-size:30px;font-weight:bold;box-shadow:0 5px 0 var(--line);position:relative}
.lv.done{background:#DFF3D8}
.lv.next{background:#FFE9A8;animation:pulse 1.4s infinite}
.lv.lock{opacity:.35}
.lv.open{background:#F4EEE5}
.lv .tick{position:absolute;right:6px;bottom:2px;font-size:18px;color:#4E9A52}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:4px 14px 30px}
.scene{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
.host{width:clamp(100px,16vw,150px)}
.host svg{width:100%;height:auto}
.bubble{background:#fff;border-radius:28px;padding:16px 26px;font-size:clamp(30px,6vw,50px);font-weight:bold;box-shadow:0 4px 0 var(--line);position:relative;white-space:nowrap}
.bubble:before{content:"";position:absolute;left:-16px;top:50%;margin-top:-12px;border-style:solid;border-width:12px 18px 12px 0;border-color:transparent #fff transparent transparent}
.bubble.notail:before{display:none}
.bubble b{color:#E07A2E}
.prompt{font-size:clamp(24px,4vw,34px);font-weight:bold;color:#6B5A4E}
.answers{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.big{min-width:140px;min-height:84px;border-radius:24px;font-size:clamp(28px,5vw,40px);font-weight:bold;background:#fff;box-shadow:0 5px 0 var(--line);padding:0 24px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.big.yes{background:#DFF3D8}
.big.no{background:#FFE9C7}
.big.num{min-width:120px}
.big.sm{min-width:70px;min-height:70px;padding:0}
.used{opacity:.25;pointer-events:none}
.toast{position:fixed;left:50%;bottom:8%;transform:translate(-50%,0) scale(.6);font-size:clamp(40px,8vw,72px);font-weight:bold;color:#fff;text-shadow:0 4px 0 #E58A3A,0 0 18px rgba(229,138,58,.5);opacity:0;pointer-events:none;transition:all .35s;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* reactions */
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.happy{animation:jumpy .8s}
@keyframes jumpy{0%,100%{transform:translateY(0)}30%{transform:translateY(-24px) rotate(-5deg)}60%{transform:translateY(0)}78%{transform:translateY(-9px) rotate(3deg)}}
.think{animation:tilt 1.1s}
@keyframes tilt{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-13deg)}}

/* puppy */
.dotsbox{--d:30px;display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:14px 20px;box-shadow:0 4px 0 var(--line);flex-wrap:wrap;justify-content:center}
.dotsbox.hidden{display:none}
.grp{display:grid;grid-template-columns:repeat(5,var(--d));gap:7px}
.dot{width:var(--d);height:var(--d);border-radius:50%}
.dot.gone{background:transparent!important;border:3px dashed #D9B25C}
.sym{font-size:38px;font-weight:bold}

/* make 10 */
.tenWrap{display:flex;gap:56px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.towerBox{display:flex;align-items:flex-end}
.tower{position:relative;width:92px;box-sizing:content-box;border:4px dashed #CDBBA6;border-radius:12px 12px 6px 6px;background:#fff;transition:background .4s}
.tower.slots{background-image:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--u) - 2px),#EDE3D6 calc(var(--u) - 2px),#EDE3D6 var(--u))}
.tower.full{background:#E4F6DC;border-color:#7BC67E;border-style:solid}
.goal{position:absolute;right:-50px;top:-16px;font-size:24px;font-weight:bold;color:#B49A7E}
.blk{position:absolute;left:5px;right:5px;border-radius:8px;display:grid;place-items:center;font-size:24px;font-weight:bold;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);background-image:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--u) - 2px),rgba(0,0,0,.13) calc(var(--u) - 2px),rgba(0,0,0,.13) var(--u))}
.blk.drop{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:translateY(0);opacity:1}}
.blk.over,.blk.short{box-shadow:0 0 0 4px #FFC48C}
.choices{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.chip{background:#fff;border-radius:18px;padding:10px;box-shadow:0 4px 0 var(--line)}
.chip:active{transform:translateY(3px)}
.cb{display:grid;place-items:center;width:52px;border-radius:8px;font-size:24px;font-weight:bold;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);background-image:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--u) - 2px),rgba(0,0,0,.13) calc(var(--u) - 2px),rgba(0,0,0,.13) var(--u))}

/* oranges */
.field{display:flex;gap:22px;align-items:flex-end;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:24px;padding:18px 20px;min-height:150px;min-width:min(520px,92vw);box-shadow:0 4px 0 var(--line);max-width:980px}
.bags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bag{width:clamp(56px,8vw,76px)}
.bag.pop{animation:drop .4s}
.loose{display:grid;grid-template-columns:repeat(5,36px);gap:6px}
.or{width:36px;height:36px}
.empty-hint{font-size:22px;color:#C4B4A2}
.ctrl{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;align-items:center}
.cgrp{display:flex;align-items:center;gap:10px;background:#fff;border-radius:24px;padding:8px 12px;box-shadow:0 4px 0 var(--line)}
.cgrp .ic{width:52px}

/* bunny hop */
.hchip{display:inline-block;background:#FDE2E9;color:#C2456A;border-radius:16px;padding:4px 14px;margin:0 5px;font-size:clamp(28px,5vw,42px)}
.hchip.back{background:#E3EAF6;color:#4A6A9C}
.hchip.now{box-shadow:0 0 0 4px #F6AFC0;transform:scale(1.08)}
.lineWrap{position:relative;padding-top:120px;max-width:100%;overflow-x:auto;overflow-y:hidden}
.track{display:flex;gap:6px;padding:0 8px 12px}
.tile{width:var(--tw);height:var(--tw);border-radius:50%;background:#CFE8B8;box-shadow:0 5px 0 #A9CC8E;display:grid;place-items:center;font-size:calc(var(--tw) * .36);font-weight:bold;flex:none}
.tile.start{background:#FFE3A3;box-shadow:0 5px 0 #E2BE6A}
.tile.glow{background:#FFD1DC;box-shadow:0 5px 0 #F09AB2,0 0 0 5px #F6AFC0}
.hopper{position:absolute;left:0;bottom:calc(var(--tw) + 6px);width:calc(var(--tw) * 1.15);min-width:58px;pointer-events:none}
.hopper svg{width:100%;height:auto}

/* sudoku */
.rule{display:flex;gap:16px;align-items:center;font-size:clamp(18px,3vw,24px);background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 3px 0 var(--line);flex-wrap:wrap;justify-content:center;font-weight:bold}
.rule span{white-space:nowrap}
.sgrid{display:grid;gap:7px;background:#E6D9C8;padding:7px;border-radius:20px}
.cell{width:var(--cs);height:var(--cs);border-radius:14px;background:#fff;display:grid;place-items:center;padding:6px}
.cell svg{width:100%;height:100%}
.cell.empty{border:3px dashed #D3C1AA}
.cell.mine{border:3px solid rgba(255,255,255,.9)}
.cell.sel{box-shadow:0 0 0 5px #7BC67E}
.cell.clash{box-shadow:inset 0 0 0 5px #FFB38A;animation:shake .5s}
.cell.bR{margin-right:8px}
.cell.bB{margin-bottom:8px}
.cell.win{animation:jumpy .8s}
.cell.hover{box-shadow:0 0 0 6px #7BC67E;transform:scale(1.05)}
.ghost{position:fixed;left:0;top:0;width:clamp(76px,14vw,104px);height:clamp(76px,14vw,104px);border-radius:22px;padding:8px;pointer-events:none;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.18);opacity:.95}
.ghost svg{width:100%;height:100%}
.ghost-blk{position:fixed;left:0;top:0;pointer-events:none;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.2);opacity:.95}
.tower.hover{border-color:#7BC67E;background-color:#F0FAEC}
.chip,.pbtn,.cell{touch-action:none}
.palette{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pbtn{width:clamp(70px,13vw,96px);height:clamp(70px,13vw,96px);border-radius:22px;padding:8px;box-shadow:0 5px 0 var(--line)}
.pbtn svg{width:100%;height:100%}
.pbtn:active{transform:translateY(3px)}
.pbtn.erase{background:#fff;font-size:36px}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(255,248,238,.92);display:grid;place-items:center;z-index:30;overflow:hidden}
.panel{text-align:center;position:relative;z-index:2}
.party{display:flex;justify-content:center;gap:10px}
.pa{width:clamp(80px,14vw,130px);animation:jumpy 1s infinite}
.pa:nth-child(2){animation-delay:.15s}.pa:nth-child(3){animation-delay:.3s}.pa:nth-child(4){animation-delay:.45s}
.panel h2{font-size:clamp(38px,7vw,60px);margin:16px 0 22px}
.panel .row{display:flex;gap:16px;justify-content:center}
.confetti i{position:absolute;top:-24px;width:13px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(600deg)}}

/* ===== new games ===== */
.duo{display:flex;align-items:center;gap:2px}.cicon .duo svg{width:54px;height:54px}
.ccoin{display:grid;place-items:center;width:54px}
.ptrain{display:flex;align-items:center;gap:2px}.ptrain span{font-size:32px}.cicon .ptrain svg{width:26px;height:26px}
.bignum{font-size:clamp(46px,9vw,84px);font-weight:bold;padding:16px 8px;white-space:nowrap}
.moreRow{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.mside{border-radius:28px;padding:14px;width:min(340px,44vw);min-height:290px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.mside.win{box-shadow:0 0 0 6px #7BC67E}
.mhost{width:84px}.mhost svg{width:100%;height:auto}
.orgrid{display:grid;grid-template-columns:repeat(5,36px);gap:6px}
.orscatter{position:relative;width:min(240px,36vw);height:170px}
.orscatter .or{position:absolute}
.scale{position:relative;width:min(760px,94vw);height:290px}
.beam{position:absolute;left:4%;right:4%;top:200px;height:14px;background:#B0825A;border-radius:7px;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.pan{position:absolute;bottom:14px;width:40%;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.pan.L{left:0}.pan.R{right:0}
.pc{min-height:100px;background:#fff;border-radius:18px 18px 34px 34px;border-bottom:8px solid #E0C9A6;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:8px;padding:10px;box-shadow:0 4px 10px rgba(0,0,0,.06)}
.fulcrum{position:absolute;left:50%;top:214px;margin-left:-38px;border-left:38px solid transparent;border-right:38px solid transparent;border-bottom:66px solid #8C6440}
.orpile{display:grid;grid-template-columns:repeat(5,28px);gap:3px}
.ors{width:28px;height:28px;display:inline-block;vertical-align:middle}.ors svg{width:100%;height:100%}
.ors.in{width:32px;height:32px}
.wt{min-width:56px;height:56px;padding:0 8px;border-radius:12px 12px 8px 8px;background:#7D8597;color:#fff;font-size:30px;font-weight:bold;display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.anpile{display:flex;gap:4px}.ans{width:52px;height:52px;display:inline-block;vertical-align:middle}.ans svg{width:100%;height:100%}
.qbox{width:60px;height:60px;border:4px dashed #D3C1AA;border-radius:12px;display:grid;place-items:center;font-size:32px;font-weight:bold;color:#B49A7E}
.legend{display:flex;align-items:center;gap:6px;background:#fff;border-radius:18px;padding:6px 16px;font-size:30px;font-weight:bold;box-shadow:0 3px 0 var(--line)}
.coin{display:inline-grid;place-items:center;border-radius:50%;border:4px solid;font-weight:bold;color:#5A4632;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.08);flex:none;vertical-align:middle}
.coin.inl{margin:0 6px}
.coinfield{gap:12px;align-items:center}
.itemE{font-size:clamp(46px,8vw,66px);margin-right:12px;vertical-align:middle}
.tag{background:#FFE3A3;border-radius:14px;padding:4px 14px;font-size:clamp(30px,5vw,44px);vertical-align:middle}
.tray{min-height:110px;min-width:min(560px,92vw);max-width:900px;background:#fff;border:4px dashed #E0D2BF;border-radius:24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px}
.tray .tc{cursor:pointer}
.wallet{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.wbtn{background:#fff;border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;min-width:92px;min-height:92px}
.wbtn:active{transform:translateY(3px)}
.train{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center;max-width:980px}
.engine{font-size:64px;line-height:1}
.wag{width:clamp(62px,9vw,90px);height:clamp(62px,9vw,90px);background:#fff;border-radius:16px;border-bottom:8px solid #C9B59C;padding:6px;display:grid;place-items:center;font-size:40px;font-weight:bold}
.wag svg{width:100%;height:100%}
.wag.q{border:4px dashed #E0A458;border-bottom-width:8px;color:#E0A458}
.train.chug{animation:chug .9s}
@keyframes chug{50%{transform:translateX(18px)}}
.big.popt{min-width:104px;min-height:104px;padding:10px;display:grid;place-items:center}
.popt svg{width:78px;height:78px}
.pnum{font-size:40px;font-weight:bold}
.pathWrap{position:relative}
.pgrid{display:grid;gap:6px;padding:6px;background:#CFE8B8;border-radius:18px}
.pcell{width:var(--pc);height:var(--pc);border-radius:10px;background:#E6F4D9;display:grid;place-items:center;padding:4px}
.pcell svg{width:100%;height:100%}
.bone{font-size:calc(var(--pc) * .55)}
.pdog{position:absolute;left:0;top:0;width:var(--pc);height:var(--pc);padding:3px;pointer-events:none;z-index:2}
.pdog svg{width:100%;height:100%}
.prog{min-height:64px;min-width:min(520px,92vw);background:#fff;border-radius:18px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line)}
.pchip{font-size:30px;border-radius:10px;padding:2px 4px}
.pchip.now{background:#DFF3D8}.pchip.bad{background:#FFD8C2}
.arrows{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.abtn{width:78px;height:78px;border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--line);font-size:40px}
.abtn:active{transform:translateY(3px)}
.abtn.del{font-size:30px;background:#FFF1E0}
.big.go{min-width:120px}
.sboard{position:relative}
.sboard .slot{position:absolute;border-radius:8px;background:#fff;border:3px dashed #D3C1AA}
.pcl{position:absolute;border-radius:8px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.pcl.placed{cursor:grab;touch-action:none}
.sboard.done{animation:jumpy .8s}
.stray{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:center;max-width:960px;min-height:80px}
.tpiece{position:relative;touch-action:none;cursor:grab}
.sghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.92;filter:drop-shadow(0 8px 14px rgba(0,0,0,.2))}
.hint{font-size:18px;color:var(--soft)}
.bigclock{width:clamp(190px,34vh,290px);height:clamp(190px,34vh,290px)}
.bigclock svg,.cbtn svg{width:100%;height:100%}
.cbtn{width:clamp(130px,22vw,180px);height:clamp(130px,22vw,180px);border-radius:24px;background:#fff;box-shadow:0 5px 0 var(--line);padding:10px}
.cbtn:active{transform:translateY(3px)}
.clab{font-size:20px;color:var(--soft);min-width:50px;text-align:center}

/* ===== games 13-20 + features ===== */
.emo{font-size:56px;line-height:1;display:inline-block}
.pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:700px;min-height:60px;background:#fff;border-radius:22px;padding:10px 16px;box-shadow:0 3px 0 var(--line);align-items:center}
.snack{font-size:38px;line-height:1}.snack.sm{font-size:28px}
.plates{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.plate{border-radius:24px;padding:10px;width:clamp(150px,22vw,200px);min-height:200px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.phost{width:72px}.phost svg{width:100%;height:auto}
.pfood{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;background:#fff;border-radius:50%;width:130px;min-height:90px;align-content:center;padding:8px}
.mgrid{display:grid;gap:12px}

/* ---------- sound & speech ---------- */
let actx=null;
function tone(fs,dur=.12,type='sine',gap=.1,vol=.22){
  try{vol*=(typeof vset!=='undefined'&&vset.sfxVol!=null)?vset.sfxVol:.7;if(vol<.0005)return;
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      const st=t+i*gap;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+dur+.15);
      o.connect(g);g.connect(actx.destination);o.start(st);o.stop(st+dur+.2)})}catch(e){}
}

try{vset=Object.assign(vset,JSON.parse(localStorage.getItem('amp-voice')||'{}'))}catch(e){}
function saveVset(){try{localStorage.setItem('amp-voice',JSON.stringify(vset))}catch(e){}}
const FUNNY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley|Hysterical|Deranged|Pipe Organ/i;
function voiceScore(v){
  let s=0;
  if(FUNNY.test(v.name))s-=100;
  if(/premium|enhanced|natural|neural|online/i.test(v.name))s+=20;
  if(/Ava|Zoe|Evan|Nathan|Samantha|Aria|Jenny|Ana|Michelle|Google US English|Google UK English Female/i.test(v.name))s+=8;
  if(/^en[-_]US/i.test(v.lang))s+=4;else if(/^en[-_](GB|AU|IE|CA)/i.test(v.lang))s+=2;
  if(v.localService===false)s+=1;
  return s;
}
function englishVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a))}catch(e){return []}}
function getVoice(){
  try{if(voice)return voice;const vs=englishVoices();
    voice=(vset.uri&&vs.find(v=>v.voiceURI===vset.uri))||vs[0]||null;return voice}catch(e){return null}
}
function speak(t,cancel){try{const s=window.speechSynthesis;if(!s)return;if(cancel)s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=vset.rate;u.pitch=1;const v=getVoice();if(v){u.voice=v;u.lang=v.lang}s.speak(u)}catch(e){}}
function voicePanel(){
  hush();
  const vs=englishVoices(),curV=getVoice();
  const ov=document.createElement('div');ov.className='overlay';
  const rates=[[.75,'🐢 Slow'],[.9,'🙂 Normal'],[1,'🐇 Fast']];
  ov.innerHTML=`<div class="vpanel"><h3>Voice（給大人設定）</h3>
  <div class="vrate">${rates.map(([r,l])=>`<button class="vr ${Math.abs(vset.rate-r)<.01?'on':''}" data-r="${r}">${l}</button>`).join('')}</div>
  <div class="vlist">${vs.length?vs.map((v,i)=>`<button class="vrow ${curV&&v.voiceURI===curV.voiceURI?'on':''}" data-i="${i}"><span>${v.name}</span><small>${v.lang}</small><b>▶</b></button>`).join(''):'<p>語音還在載入，請按 OK 後再開一次。</p>'}</div>
  <button class="big yes" id="vok">OK</button></div>`;
  app.appendChild(ov);
  ov.querySelectorAll('.vr').forEach(b=>b.onclick=()=>{vset.rate=+b.dataset.r;saveVset();ov.querySelectorAll('.vr').forEach(x=>x.classList.toggle('on',x===b));speak('Hello! Seven and three make ten.',true)});
  ov.querySelectorAll('.vrow').forEach(b=>b.onclick=()=>{const v=vs[+b.dataset.i];vset.uri=v.voiceURI;voice=v;saveVset();
    ov.querySelectorAll('.vrow').forEach(x=>x.classList.toggle('on',x===b));speak('Hello! Seven and three make ten.',true)});
  $('#vok').onclick=()=>{hush();ov.remove()};
}
function say(t){lastLine=t;speak(t,true)}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
try{speechSynthesis.onvoiceschanged=()=>{voice=null}}catch(e){}

const ALL4=['capy','bunny','cat','dog'];
const PRAISE=['Great job!','Yes!','You got it!','Super!','Well done!','Wow!'];
let session=null;
const alive=tok=>session&&session.tok===tok;
function later(fn,ms){const tok=session&&session.tok;setTimeout(()=>{if(alive(tok))fn()},ms)}
function react(el,cls){if(!el)return;el.classList.remove('happy','think');void el.offsetWidth;el.classList.add(cls)}
function toast(t){const el=$('#toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1100)}
function gameIcon(g){if(g.icon)return g.icon();return g.host==='all'?`<div class="four">${ALL4.map(k=>svgAnimal(k)).join('')}</div>`:svgAnimal(g.host,{orange:g.host==='capy'})}

function levels(id){
  session=null;hush();

  <div class="lvGrid">${Array.from({length:LEVELS},(_,i)=>{const L=i+1,st=L<=d?'done':L===d+1?'next':(typeof vset!=='undefined'&&vset.unlockAll)?'open':'lock';
    return `<button class="lv ${st}" data-l="${L}">${L}${st==='done'?'<span class="tick">✓</span>':''}</button>`}).join('')}</div>`;

    if(L>(progress[id]||0)+1&&!(typeof vset!=='undefined'&&vset.unlockAll)){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}

function startLevel(id,L){
  session={id,L,round:0,tok:Math.random()};
  app.innerHTML=`<div class="topbar"><button class="iconbtn" id="back">⬅</button><div class="lvl">Level ${L}</div><div class="rdots" id="rdots"></div><button class="iconbtn" id="spk">🔊</button></div>
  <div class="stage" id="stage"></div><div class="toast" id="toast"></div>`;
  $('#back').onclick=()=>levels(id);
  $('#spk').onclick=()=>say(lastLine);

}
function drawRoundDots(){const g=GAMES[session.id];$('#rdots').innerHTML=g.rounds<2?'':Array.from({length:g.rounds},(_,i)=>`<i class="${i<session.round?'on':''}"></i>`).join('')}
function roundDone(hostEl,line,quiet){
  if(!quiet){sfx.good();react(hostEl,'happy');const p=pick(PRAISE);toast(p);say((line?line+' ':'')+p)}
  else if(line)say(line);
  session.round++;drawRoundDots();
  const g=GAMES[session.id];
  if(session.round>=g.rounds)later(levelDone,quiet?900:1700);
  else later(()=>g.round(session.L,session.round),quiet?700:1900);
}
function levelDone(){
  const {id,L}=session;
  const perfect=!session.miss&&L<LEVELS&&!GAMES[id].noSkip&&(typeof vset==='undefined'||vset.skipPerfect!==false);
  const nextL=perfect?Math.min(LEVELS,L+3):L+1;
  progress[id]=Math.max(progress[id]||0,perfect?nextL-1:L);saveProg();
  const g=GAMES[id],last=L>=LEVELS;sfx.win();
  say(last?'You did it! All levels done! You are a star!':perfect&&nextL>L+1?`Perfect! No mistakes! Let's jump to level ${nextL}!`:'Level done! Great job!');
  const hosts=g.host==='all'?ALL4:[g.host];
  const cols=['#FF9AA2','#FFD966','#B5E48C','#A0C4FF','#FFB347','#CDB4DB'];
  const conf=Array.from({length:44},()=>`<i style="left:${rand(0,100)}%;background:${pick(cols)};animation-delay:${(Math.random()*.8).toFixed(2)}s;animation-duration:${(2+Math.random()*1.6).toFixed(2)}s"></i>`).join('');
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="confetti">${conf}</div><div class="panel"><div class="party">${hosts.map(k=>`<div class="pa">${svgAnimal(k,{orange:k==='capy'})}</div>`).join('')}</div>
  <h2>${last?'All done! ⭐':perfect&&nextL>L+1?'Perfect! ⏩ Level '+nextL:'Level '+L+' done!'}</h2><div class="row">${last?'':'<button class="big yes" id="nx">Next ▶</button>'}<button class="big" id="lvb">Levels</button></div></div>`;
  app.appendChild(ov);
  if(!last)$('#nx').onclick=()=>startLevel(id,nextL);
  $('#lvb').onclick=()=>levels(id);
}

/* ---------- 1. Teach Puppy (+ / -) ---------- */
const OPW={'+':'plus','-':'minus'};
function genPuppy(L){
  let a,b,op='+',ans,dots=true;
  if(L<=5){ans=rand(2,5);a=rand(1,ans-1);b=ans-a}
  else if(L<=10){ans=rand(5,10);a=rand(1,ans-1);b=ans-a}
  else if(L<=15){ans=rand(4,10);a=rand(1,ans-1);b=ans-a;dots=false}
  else if(L<=20){op='-';a=rand(3,10);b=rand(1,a-1);ans=a-b}
  else if(L<=25){dots=false;if(Math.random()<.5){ans=rand(3,10);a=rand(1,ans-1);b=ans-a}else{op='-';a=rand(4,10);b=rand(1,a-1);ans=a-b}}
  else{a=rand(5,9);b=rand(11-a,9);ans=a+b}
  const right=Math.random()<.5;
  const shown=right?ans:pick([ans-2,ans-1,ans+1,ans+2].filter(x=>x>=0));
  return{a,b,op,ans,shown,right,dots};
}
function dotsHTML(q){
  const grp=(n,col,goneFrom=99)=>`<div class="grp" style="grid-template-columns:repeat(${Math.min(n,5)},var(--d))">${Array.from({length:n},(_,i)=>`<span class="dot${i>=goneFrom?' gone':''}" style="background:${col}"></span>`).join('')}</div>`;
  if(q.op==='+')return grp(q.a,'#F5C451')+'<span class="sym">+</span>'+grp(q.b,'#9BB0D1');
  return grp(q.a,'#F5C451',q.a-q.b);
}
function puppyRound(L){
  const q=genPuppy(L),sym=q.op==='+'?'+':'−',eq=`${q.a} ${sym} ${q.b}`,words=`${q.a} ${OPW[q.op]} ${q.b}`;
  stage().innerHTML=`<div class="scene"><div class="host" id="host">${svgAnimal('dog')}</div><div class="bubble" id="bub">${eq} = <b>${q.shown}</b> ?</div></div>
  <div class="dotsbox ${q.dots?'':'hidden'}" id="dbox">${dotsHTML(q)}</div>
  <div class="prompt" id="pr">Is Puppy right?</div>
  <div class="answers" id="ans"><button class="big yes" id="y">👍 Yes</button><button class="big no" id="n">🤔 No</button></div>`;
  const host=$('#host');
  say(`Puppy says, ${words} is ${q.shown}. Is Puppy right?`);
  const lock=()=>$('#ans').querySelectorAll('button').forEach(b=>b.disabled=true);
  const showDots=()=>$('#dbox').classList.remove('hidden');
  const fix=prefix=>{
    $('#pr').textContent=`${eq} = ?`;
    const opts=shuffle([q.ans,...shuffle([q.ans-2,q.ans-1,q.ans+1,q.ans+2].filter(x=>x>=0&&x!==q.shown)).slice(0,2)]);
    $('#ans').innerHTML=opts.map(v=>`<button class="big num" data-v="${v}">${v}</button>`).join('');
    say(`${prefix} Help Puppy! What is ${words}?`);
    $('#ans').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(+b.dataset.v===q.ans){$('#bub').innerHTML=`${eq} = <b>${q.ans}</b>`;$('#pr').textContent='Thank you!';lock();roundDone(host,`${words} is ${q.ans}. Thank you!`)}
      else{b.classList.add('shake','used');sfx.soft();react(host,'think');say('Try again!')}
    });
  };
  $('#y').onclick=()=>{
    if(q.right){$('#bub').innerHTML=`${eq} = <b>${q.ans}</b> ✓`;lock();roundDone(host,'Yes! Puppy is right!')}
    else{sfx.soft();react(host,'think');showDots();fix("Hmm, let's count. Puppy made a mistake.")}
  };
  $('#n').onclick=()=>{
    if(!q.right){sfx.good();react(host,'think');fix('Yes, Puppy made a mistake!')}
    else{showDots();react(host,'happy');$('#bub').innerHTML=`${eq} = <b>${q.ans}</b> ✓`;$('#pr').textContent='Puppy is right!';
      say(`Let's count! ${words} is ${q.ans}. Puppy is right!`);
      $('#ans').innerHTML='<button class="big yes" id="ok">OK 👍</button>';
      $('#ok').onclick=()=>{$('#ok').disabled=true;roundDone(host,'',true)}}
  };
}

/* ---------- 2. Make 10 ---------- */
const RODC=['','#FF8FA3','#FFAA5C','#F2C94C','#8FD16A','#5CCFB0','#7FB2FF','#A38BFF','#F28CE0','#B98D63'];
function genTen(L){
  let target=10,base,nC=3,slots=true,labels=false,eq=false;
  if(L<=6){target=5;base=[rand(1,4)]}
  else if(L<=14){base=[rand(1,9)]}
  else if(L<=20){base=[rand(1,9)];nC=4}
  else if(L<=25){base=[rand(1,9)];nC=4;slots=false;labels=true;eq=true}
  else{const b1=rand(1,7),b2=rand(1,8-b1);base=[b1,b2];nC=4;slots=false;labels=true;eq=true}
  const sum=base.reduce((s,x)=>s+x,0),need=target-sum;
  const pool=[];for(let k=1;k<target;k++)if(k!==need)pool.push(k);
  pool.sort((x,y)=>Math.abs(x-need)-Math.abs(y-need)||Math.random()-.5);
  const choices=shuffle([need,...shuffle(pool.slice(0,Math.min(nC+1,pool.length))).slice(0,nC-1)]);
  return{target,base,need,choices,slots,labels,eq,sum};
}
function tenRound(L){
  const q=genTen(L),over=Math.max(0,Math.max(...q.choices)-q.need);
  const u=Math.max(16,Math.min(q.target===5?40:28,Math.floor((window.innerHeight-300)/(q.target+over*.6))));
  stage().style.setProperty('--u',u+'px');
  let acc=0;
  const blocks=q.base.map(k=>{const h=`<div class="blk" style="bottom:${acc*u}px;height:${k*u}px;background-color:#9BB0D1">${q.labels?k:''}</div>`;acc+=k;return h}).join('');
  stage().innerHTML=`<div class="scene"><div class="host" id="host">${svgAnimal('cat')}</div><div class="bubble" id="bub">${q.eq?`${q.base.join(' + ')} + ? = <b>${q.target}</b>`:`Make <b>${q.target}</b>!`}</div></div>
  <div class="tenWrap"><div class="towerBox" style="padding-top:${over*u+20}px"><div class="tower ${q.slots?'slots':''}" id="tower" style="height:${q.target*u}px"><div class="goal">← ${q.target}</div>${blocks}</div></div>
  <div class="choices" id="ch">${q.choices.map(k=>`<button class="chip" data-k="${k}"><span class="cb" style="height:${k*u}px;background-color:${RODC[k]}">${q.labels?k:''}</span></button>`).join('')}</div></div>`;
  const host=$('#host'),tower=$('#tower');
  say(q.eq?`${q.base.join(' plus ')} plus what makes ${q.target}?`:`Make ${q.target}! Which block fits?`);
  let busy=false,dragJustEnded=false;
  const tok=session.tok;
  /* drag a block onto the tower */
  let drag=null;
  const overTower=(x,y)=>{const r=tower.getBoundingClientRect(),pad=40;return x>r.left-pad&&x<r.right+pad&&y>r.top-160&&y<r.bottom+pad};
  stage().addEventListener('pointerdown',e=>{
    const b=e.target.closest('#ch .chip');if(!b||busy||b.classList.contains('used'))return;
    drag={b,k:+b.dataset.k,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,id:e.pointerId};
  });
  const onMove=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<10)return;
    e.preventDefault();
    if(!drag.moved){
      drag.moved=true;const src=drag.b.querySelector('.cb');
      const g=src.cloneNode(true);g.classList.add('ghost-blk');stage().appendChild(g);drag.ghost=g;
      drag.b.style.visibility='hidden';sfx.pop();
    }
    drag.ghost.style.transform=`translate(${e.clientX-drag.ghost.offsetWidth/2}px,${e.clientY-drag.ghost.offsetHeight/2}px)`;
    tower.classList.toggle('hover',overTower(e.clientX,e.clientY));
  };
  const onUp=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const d=drag;drag=null;if(!d.moved)return;
    dragJustEnded=true;setTimeout(()=>{dragJustEnded=false},60);
    d.ghost.remove();tower.classList.remove('hover');
    if(!alive(tok))return;
    if(overTower(e.clientX,e.clientY))choose(d.k,d.b);else d.b.style.visibility='';
  };
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
  const watch=setInterval(()=>{if(alive(tok)&&session.round===roundNo)return;
    window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onUp);clearInterval(watch)},1000);
  const roundNo=session.round;
  $('#ch').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(!dragJustEnded)choose(+b.dataset.k,b)});
  function choose(k,b){
    if(busy)return;busy=true;
    const el=document.createElement('div');el.className='blk drop';
    el.style.cssText=`bottom:${q.sum*u}px;height:${k*u}px;background-color:${RODC[k]}`;el.textContent=q.labels?k:'';
    tower.appendChild(el);b.style.visibility='hidden';
    if(k===q.need){
      tower.classList.add('full');$('#bub').innerHTML=`${[...q.base,k].join(' + ')} = <b>${q.target}</b>`;
      roundDone(host,`${[...q.base,k].join(' and ')} make ${q.target}!`);
    }else{
      sfx.soft();react(host,'think');el.classList.add(k>q.need?'over':'short');
      say(k>q.need?'Too big! Try again.':'Too small! Try again.');
      later(()=>{el.remove();b.style.visibility='';b.classList.add('used');busy=false},1500);
    }
  }
}

/* ---------- 3. Orange Bags (tens & ones) ---------- */
const bagWord=t=>t===1?'1 bag':t+' bags',orWord=o=>o===1?'1 orange':o+' oranges';
function genOrange(L){
  let t,o;
  if(L<=20){
    t=L<=5?1:L<=10?rand(1,3):L<=15?rand(2,5):rand(3,9);
    o=rand(0,9);if(o===0&&Math.random()<.6)o=rand(1,9);
    const n=t*10+o,c=new Set();
    if(o>0&&o!==t)c.add(o*10+t);
    [n+10,n-10,n+1,n-1].forEach(x=>{if(x>=1&&x<=99)c.add(x)});c.delete(n);
    return{mode:'count',t,o,n,opts:shuffle([n,...shuffle([...c]).slice(0,2)]),inside:L<=10};
  }
  t=L<=25?rand(1,4):rand(3,9);o=rand(1,9);
  return{mode:'build',t,o,n:t*10+o,inside:L<=25};
}
function fieldHTML(t,o,inside){
  if(!t&&!o)return '<div class="empty-hint">Tap + to add</div>';
  return `${t?`<div class="bags">${Array.from({length:t},()=>`<div class="bag">${bagSVG(inside)}</div>`).join('')}</div>`:''}${o?`<div class="loose">${Array.from({length:o},()=>`<span class="or">${ORANGE_SVG}</span>`).join('')}</div>`:''}`;
}
function orangeRound(L){
  const q=genOrange(L);
  const head=`<div class="scene"><div class="host" id="host">${svgAnimal('capy',{orange:true})}</div><div class="bubble" id="bub">${q.mode==='count'?'How many?':`Make <b>${q.n}</b>!`}</div></div>`;
  if(q.mode==='count'){
    stage().innerHTML=`${head}<div class="field">${fieldHTML(q.t,q.o,q.inside)}</div>
    <div class="answers" id="ans">${q.opts.map(v=>`<button class="big num" data-v="${v}">${v}</button>`).join('')}</div>`;
    const host=$('#host');
    say('How many oranges? One bag has 10.');
    $('#ans').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(+b.dataset.v===q.n){$('#ans').querySelectorAll('button').forEach(x=>x.disabled=true);$('#bub').innerHTML=`<b>${q.n}</b>!`;
        roundDone(host,q.o?`${bagWord(q.t)} and ${orWord(q.o)}. ${q.n}!`:`${bagWord(q.t)}. ${q.n}!`)}
      else{b.classList.add('shake','used');sfx.soft();react(host,'think');say('Count again! Each bag has 10.')}
    });
    return;
  }
  stage().innerHTML=`${head}<div class="field" id="fd"></div>
  <div class="ctrl"><div class="cgrp"><button class="big sm" id="bm">−</button><div class="ic">${bagSVG(false)}</div><button class="big sm" id="bp">+</button></div>
  <div class="cgrp"><button class="big sm" id="om">−</button><div class="ic">${ORANGE_SVG}</div><button class="big sm" id="op">+</button></div>
  <button class="big yes" id="done">Done ✓</button></div>`;
  const host=$('#host'),fd=$('#fd');let bt=0,bo=0,tries=0,over=false;
  const draw=(popBag)=>{fd.innerHTML=fieldHTML(bt,bo,q.inside);if(popBag){const bs=fd.querySelectorAll('.bag');if(bs.length)bs[bs.length-1].classList.add('pop')}};
  draw();say(`Can you make ${q.n} oranges?`);
  $('#bp').onclick=()=>{if(over||bt>=9)return;bt++;sfx.pop();draw(true)};
  $('#bm').onclick=()=>{if(over||bt<=0)return;bt--;sfx.pop();draw()};
  $('#op').onclick=()=>{if(over)return;if(bo<9){bo++;sfx.pop();draw()}else if(bt<9){bo=0;bt++;sfx.good();draw(true);say('Ten oranges make one bag!')}};
  $('#om').onclick=()=>{if(over||bo<=0)return;bo--;sfx.pop();draw()};
  $('#done').onclick=()=>{
    if(over)return;
    if(bt*10+bo===q.n){over=true;roundDone(host,`${bagWord(bt)} and ${orWord(bo)}. ${q.n}!`)}
    else{tries++;sfx.soft();react(host,'think');say(tries<2?'Not yet! Look at the bags and the oranges again.':`We need ${bagWord(q.t)} and ${orWord(q.o)}.`)}
  };
}

/* ---------- 4. Bunny Hop (number line) ---------- */
function genHop(L){
  /* returns a list of jumps (signed), all landing on the tile grid */
  for(let tr=0;tr<300;tr++){
    let unit=1,start,jumps=[];
    const same=(s,n)=>Array(n).fill(s);
    const mix=(lo,hi,n,back)=>Array.from({length:n},(_,i)=>{const s=rand(lo,hi);return back&&i>0&&Math.random()<.4?-s:s});
    if(L<=4){start=rand(0,5);jumps=mix(1,4,2,false)}
    else if(L<=8){start=rand(0,5);jumps=mix(1,4,3,false)}
    else if(L<=12){start=pick([0,0,rand(1,4)]);jumps=same(pick([2,3,4]),rand(2,4))}
    else if(L<=16){start=rand(3,9);jumps=mix(1,4,3,true)}
    else if(L<=20){unit=5;start=5*rand(0,4);jumps=Array.from({length:rand(2,3)},()=>pick([5,5,10]))}
    else if(L<=24){unit=10;start=rand(1,39);jumps=same(10,rand(2,4))}
    else if(L<=27){start=rand(10,20);jumps=same(-pick([2,3,4,5]),rand(2,3))}
    else{start=rand(2,12);jumps=mix(1,7,rand(2,3),true)}
    const path=[start];jumps.forEach(j=>path.push(path[path.length-1]+j));
    if(path.some(v=>v<0))continue;
    if(jumps.reduce((s,j)=>s+j,0)===0)continue;
    const mn=Math.min(...path),mx=Math.max(...path),span=(mx-mn)/unit;
    if(span>10)continue;
    let lo=mn-unit*rand(0,Math.min(10-span,Math.floor(mn/unit)));
    if(lo+10*unit<mx)lo=mx-10*unit;
    return{unit,start,jumps,path,end:path[path.length-1],tiles:Array.from({length:11},(_,i)=>lo+i*unit)};
  }
  return{unit:1,start:0,jumps:[2,3],path:[0,2,5],end:5,tiles:Array.from({length:11},(_,i)=>i)};
}
function animateHop(el,x0,x1,dur,cb){
  const t0=performance.now();
  const f=t=>{const p=Math.min(1,(t-t0)/dur),x=x0+(x1-x0)*p,y=-Math.sin(Math.PI*p)*55;el.style.transform=`translate(${x}px,${y}px)`;if(p<1)requestAnimationFrame(f);else cb&&cb()};
  requestAnimationFrame(f);
}
function hopRound(L){
  const q=genHop(L),tok=session.tok;
  const tw=Math.max(40,Math.min(78,Math.floor((window.innerWidth-50-10*6)/11)));
  stage().style.setProperty('--tw',tw+'px');
  const chipTxt=j=>(j>0?'+':'−')+Math.abs(j);
  stage().innerHTML=`<div class="scene"><div class="host" style="width:clamp(80px,12vw,110px)">${svgAnimal('bunny')}</div><div class="bubble" id="bub">${q.jumps.map(j=>`<span class="hchip${j<0?' back':''}">${chipTxt(j)}</span>`).join('')}</div></div>
  <div class="prompt">Where will Bunny stop?</div>
  <div class="lineWrap" id="lw"><div class="track">${q.tiles.map(v=>`<button class="tile${v===q.start?' start':''}" data-v="${v}">${v}</button>`).join('')}</div>
  <div class="hopper" id="hp"><div id="hpi">${svgAnimal('bunny')}</div></div></div>`;
  const lw=$('#lw'),hp=$('#hp'),hpi=$('#hpi');
  const tileOf=v=>lw.querySelector(`.tile[data-v="${v}"]`);
  const xOf=v=>{const t=tileOf(v);return t.offsetLeft+t.offsetWidth/2-hp.offsetWidth/2};
  let curX=0,curV=q.start,busy=false,tries=0,reveal=false;
  const place=v=>{curV=v;curX=xOf(v);hp.style.transform=`translate(${curX}px,0)`};
  requestAnimationFrame(()=>{if(!alive(tok))return;place(q.start);const st=tileOf(q.start);lw.scrollLeft=Math.max(0,st.offsetLeft-60)});
  const onResize=()=>{if(!alive(tok)||!document.body.contains(hp)){window.removeEventListener('resize',onResize);return}if(!busy)place(curV)};
  window.addEventListener('resize',onResize);
  say(`Bunny is on ${q.start}. ${q.jumps.map(j=>(j>0?'jump ':'jump back ')+Math.abs(j)).join(', ')}. Where will Bunny stop?`);
  const chips=()=>[...$('#bub').querySelectorAll('.hchip')];
  const hopSeq=cb=>{
    busy=true;hush();let i=0;chips().forEach(c=>c.classList.remove('now'));
    const next=()=>{if(!alive(tok))return;if(i>=q.jumps.length){cb&&cb();return}
      const ch=chips();ch.forEach((c,k)=>c.classList.toggle('now',k===i));
      i++;const np=q.path[i],x1=xOf(np);
      animateHop(hp,curX,x1,520,()=>{curX=x1;curV=np;speak(String(np),false);sfx.pop();setTimeout(next,450)})};
    if(curV!==q.start){place(q.start)}
    next();
  };
  lw.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    if(busy)return;const v=+t.dataset.v;
    const wiggle=()=>{t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')};
    if(reveal){if(v===q.end){busy=true;roundDone(hpi,`Bunny stops at ${q.end}!`,false)}else wiggle();return}
    if(v===q.end){hopSeq(()=>{t.classList.add('glow');roundDone(hpi,`Bunny stops at ${q.end}!`)})}
    else{tries++;sfx.soft();wiggle();react(hpi,'think');
      if(tries<2)say('Try again! Count the jumps.');
      else{say("Let's jump together!");setTimeout(()=>{if(!alive(tok))return;hopSeq(()=>{reveal=true;busy=false;tileOf(q.end).classList.add('glow');say(`Bunny stops at ${q.end}! Tap ${q.end}.`)})},1300)}}
  });
}

/* ---------- 5. Animal Sudoku ---------- */
function latin3(){const b=[[0,1,2],[1,2,0],[2,0,1]],rp=shuffle([0,1,2]),cp=shuffle([0,1,2]),sp=shuffle([0,1,2]);return rp.map(r=>cp.map(c=>sp[b[r][c]]))}
function sudoku4(){
  const b=[[0,1,2,3],[2,3,0,1],[1,0,3,2],[3,2,1,0]];
  const perm=()=>{const out=[];shuffle([0,1]).forEach(bd=>shuffle([0,1]).forEach(x=>out.push(bd*2+x)));return out};
  const rp=perm(),cp=perm(),sp=shuffle([0,1,2,3]);
  let g=rp.map(r=>cp.map(c=>sp[b[r][c]]));
  if(Math.random()<.5)g=g[0].map((_,c)=>g.map(r=>r[c]));
  return g;
}
function okAt(p,n,box,r,c,v){
  for(let i=0;i<n;i++){if(p[r][i]===v||p[i][c]===v)return false}
  if(box){const br=r-r%2,bc=c-c%2;for(let i=br;i<br+2;i++)for(let j=bc;j<bc+2;j++)if(p[i][j]===v)return false}
  return true;
}
function countSol(p,n,box,lim){
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(p[r][c]<0){
    let cnt=0;
    for(let v=0;v<n;v++)if(okAt(p,n,box,r,c,v)){p[r][c]=v;cnt+=countSol(p,n,box,lim-cnt);p[r][c]=-1;if(cnt>=lim)return cnt}
    return cnt;
  }
  return 1;
}
function sudokuCfg(L){
  if(L<=3)return{n:3,blanks:2,box:false};if(L<=7)return{n:3,blanks:3,box:false};if(L<=10)return{n:3,blanks:4,box:false};
  if(L<=12)return{n:3,blanks:5,box:false};if(L<=15)return{n:4,blanks:4,box:false};if(L<=18)return{n:4,blanks:6,box:false};
  if(L<=22)return{n:4,blanks:6,box:true};if(L<=26)return{n:4,blanks:8,box:true};return{n:4,blanks:10,box:true};
}
function genSudoku(L){
  const cfg=sudokuCfg(L);let best=null;
  for(let tr=0;tr<40;tr++){
    const n=cfg.n,sol=n===3?latin3():sudoku4(),p=sol.map(r=>r.slice());let rem=0;
    for(const c of shuffle([...Array(n*n).keys()])){
      if(rem>=cfg.blanks)break;const r=Math.floor(c/n),cc=c%n,v=p[r][cc];p[r][cc]=-1;
      if(countSol(p,n,cfg.box,2)===1)rem++;else p[r][cc]=v;
    }
    const res=Object.assign({},cfg,{sol,p,rem});
    if(!best||rem>best.rem)best=res;if(rem>=cfg.blanks)break;
  }
  return best;
}
const SETS3=[['capy','bunny','cat'],['bunny','cat','dog'],['capy','cat','dog'],['capy','bunny','dog']];
function sudokuRound(L){
  const q=genSudoku(L),n=q.n,an=n===4?ALL4:SETS3[L%4];
  const cs=Math.floor(Math.max(56,Math.min(120,(window.innerWidth-70)/n,(window.innerHeight-380)/n)));

  <div class="sgrid" id="sg" style="grid-template-columns:repeat(${n},auto)"></div>
  <div class="palette" id="pal">${an.map((k,i)=>`<button class="pbtn" data-i="${i}" style="background:${A[k].tint}">${svgAnimal(k)}</button>`).join('')}<button class="pbtn erase" id="er">↩</button></div>`;
  const sg=$('#sg');
  const clashes=()=>{const s=new Set();
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){const v=cur[r][c];if(v<0)continue;
      for(let r2=0;r2<n;r2++)for(let c2=0;c2<n;c2++){if(r2===r&&c2===c)continue;if(cur[r2][c2]!==v)continue;
        const same=r2===r||c2===c||(q.box&&Math.floor(r2/2)===Math.floor(r/2)&&Math.floor(c2/2)===Math.floor(c/2));
        if(same){s.add(r+','+c);s.add(r2+','+c2)}}}
    return s};
  const draw=(cl=new Set())=>{
    let h='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const v=cur[r][c],given=q.p[r][c]>=0;

        sel&&sel[0]===r&&sel[1]===c?'sel':'',cl.has(r+','+c)?'clash':''].join(' ');
      h+=`<div class="${cls}" data-r="${r}" data-c="${c}" style="${v>=0?`background:${A[an[v]].tint}`:''}">${v>=0?svgAnimal(an[v]):''}</div>`;

  const placeAt=(r,c,i)=>{

    if(cl.size){sfx.soft();say(`Oops! Two ${A[an[i]].plural} in one line. Try again!`);return}
    sfx.pop();
    if(cur.every(row=>row.every(v=>v>=0))){
      done=true;
      sg.querySelectorAll('.cell').forEach((el,k)=>setTimeout(()=>el.classList.add('win'),k*45));
      roundDone(null,'You did it!');
    }
  };
  /* tap: tap a box, then tap an animal */
  sg.onclick=e=>{
    if(done||dragJustEnded)return;const el=e.target.closest('.cell');if(!el)return;
    const r=+el.dataset.r,c=+el.dataset.c;if(q.p[r][c]>=0)return;
    sel=[r,c];sfx.pop();draw(clashes());
  };
  $('#pal').querySelectorAll('.pbtn[data-i]').forEach(b=>b.onclick=()=>{
    if(done||dragJustEnded)return;
    if(!sel){say('Drag an animal to an empty box!');return}
    placeAt(sel[0],sel[1],+b.dataset.i);
  });
  $('#er').onclick=()=>{if(done||!sel)return;cur[sel[0]][sel[1]]=-1;sfx.pop();draw(clashes())};

  /* drag: from the animal row, or move an animal already placed */
  let drag=null,dragJustEnded=false;
  const cellAt=(x,y)=>{const el=document.elementFromPoint(x,y);const c=el&&el.closest?el.closest('#sg .cell'):null;
    if(!c)return null;const r=+c.dataset.r,cc=+c.dataset.c;return q.p[r][cc]>=0?null:{el:c,r,c:cc}};
  const startDrag=(e,i,from)=>{
    if(done)return;
    drag={i,from,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,hover:null,id:e.pointerId};
  };
  stage().addEventListener('pointerdown',e=>{
    const pb=e.target.closest('#pal .pbtn[data-i]');
    if(pb){startDrag(e,+pb.dataset.i,null);return}
    const ce=e.target.closest('#sg .cell.mine');
    if(ce){const r=+ce.dataset.r,c=+ce.dataset.c;startDrag(e,cur[r][c],[r,c])}
  });
  const onMove=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(!drag.moved&&Math.hypot(dx,dy)<10)return;
    e.preventDefault();
    if(!drag.moved){
      drag.moved=true;
      const g=document.createElement('div');g.className='ghost';g.style.background=A[an[drag.i]].tint;g.innerHTML=svgAnimal(an[drag.i]);
      document.body.appendChild(g);drag.ghost=g;sfx.pop();
      if(drag.from){cur[drag.from[0]][drag.from[1]]=-1;sel=null;draw(clashes())}
    }
    drag.ghost.style.transform=`translate(${e.clientX-drag.ghost.offsetWidth/2}px,${e.clientY-drag.ghost.offsetHeight/2}px)`;
    const h=cellAt(e.clientX,e.clientY);
    if(drag.hover&&(!h||h.el!==drag.hover))drag.hover.classList.remove('hover');
    if(h){h.el.classList.add('hover');drag.hover=h.el}else drag.hover=null;
  };
  const onUp=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const d=drag;drag=null;
    if(!d.moved)return;
    dragJustEnded=true;setTimeout(()=>{dragJustEnded=false},60);
    d.ghost.remove();
    if(!alive(tok))return;

  const tok=session.tok;
  const cleanup=()=>{window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onUp)};
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
  const watch=setInterval(()=>{if(!alive(tok)){cleanup();clearInterval(watch);document.querySelectorAll('.ghost').forEach(g=>g.remove())}},1000);
}

function roundListeners(){

function numOpts(ans,cands,min){
  min=min===undefined?0:min;const s=new Set();
  shuffle(cands.slice()).forEach(x=>{if(x!==ans&&x>=min&&s.size<2)s.add(x)});
  let d=1;while(s.size<2){[ans+d,ans-d].forEach(x=>{if(x>=min&&x!==ans&&s.size<2)s.add(x)});d++}
  return shuffle([ans,...s]);
}

/* ---------- 6. Who Has More? ---------- */
function genMore(L){
  const eqOK=L>=11,ask=L>=6&&Math.random()<.35?'fewer':'more';
  let a,b,mode='dots',ae=null,be=null;
  if(L<=5){a=rand(1,10);do{b=rand(1,10)}while(Math.abs(a-b)<2)}
  else if(L<=10){a=rand(2,9);b=a+pick([-1,1])}
  else if(L<=15){mode='num';a=rand(0,20);do{b=rand(0,20)}while(b===a)}
  else if(L<=20){mode='num';a=rand(20,99);do{b=rand(20,99)}while(Math.floor(a/10)===Math.floor(b/10))}
  else if(L<=25){mode='num';if(Math.random()<.5){const t=rand(1,8),o=rand(t+1,9);a=t*10+o;b=o*10+t}else{const t=rand(2,9);a=t*10+rand(0,9);do{b=t*10+rand(0,9)}while(b===a)}}
  else{mode='expr';const x=rand(1,9),y=rand(1,9);a=x+y;ae=`${x} + ${y}`;
    if(Math.random()<.5){do{b=rand(Math.max(2,a-3),a+3)}while(b===a)}
    else{let p,r;do{p=rand(1,9);r=rand(1,9)}while(p+r===a||Math.abs(p+r-a)>3);b=p+r;be=`${p} + ${r}`}}
  if(eqOK&&Math.random()<.15){
    if(mode==='expr'&&be){const p=rand(Math.max(1,a-9),Math.min(9,a-1));be=`${p} + ${a-p}`}
    b=a;
  }
  if(Math.random()<.5){[a,b]=[b,a];[ae,be]=[be,ae]}
  return{mode,a,b,ae,be,ask,eqOK,scatter:L>=6&&L<=10};
}
function moreContent(v,expr,mode,scatter){
  if(mode!=='dots')return `<div class="bignum">${expr||v}</div>`;
  if(!scatter)return `<div class="orgrid">${Array.from({length:v},()=>`<span class="or">${ORANGE_SVG}</span>`).join('')}</div>`;

}
function moreRound(L){
  const q=genMore(L),an=shuffle(ALL4.slice()).slice(0,2);
  const correct=q.a===q.b?'S':(q.ask==='more'?(q.a>q.b?'L':'R'):(q.a<q.b?'L':'R'));
  stage().innerHTML=`<div class="bubble notail" id="bub">Who has <b>${q.ask}</b>?</div>
  <div class="moreRow">${[0,1].map(i=>`<button class="mside" data-s="${i?'R':'L'}" style="background:${A[an[i]].tint}"><div class="mhost">${svgAnimal(an[i],{orange:an[i]==='capy'})}</div>${moreContent(i?q.b:q.a,i?q.be:q.ae,q.mode,q.scatter)}</button>`).join('')}</div>
  ${q.eqOK?'<button class="big" id="same" data-s="S">🟰 Same</button>':''}`;
  say(`Who has ${q.ask}? ${A[an[0]].name} or ${A[an[1]].name}?`);

  else{fill='w';const a=rand(4,9),b=rand(11-a,9),c=L<=27?10:rand(6,9);left=[{t:'w',n:a},{t:'w',n:b}];right=[{t:'w',n:c},{t:'q'}];ans=a+b-c}
  return{mode,left,right,ans,legend,fill};
}

const DIRS={U:[-1,0,'⬆️','up'],D:[1,0,'⬇️','down'],Lf:[0,-1,'⬅️','left'],R:[0,1,'➡️','right']};
function bfs(n,obs,s){const d=Array(n*n).fill(Infinity);d[s]=0;const Q=[s];
  while(Q.length){const c=Q.shift(),r=Math.floor(c/n),cc=c%n;for(const k in DIRS){const nr=r+DIRS[k][0],nc=cc+DIRS[k][1];
    if(nr<0||nc<0||nr>=n||nc>=n)continue;const x=nr*n+nc;if(obs.has(x)||d[x]!==Infinity)continue;d[x]=d[c]+1;Q.push(x)}}return d}
function genPath(L){
  const cfg=L<=5?{n:4,obs:0,m:'straight'}:L<=10?{n:4,obs:0,m:'bend'}:L<=15?{n:5,obs:3,min:4,max:6}:L<=20?{n:5,obs:5,min:5,max:8}
    :L<=25?{n:5,obs:3,bone:true,min:6,max:10}:{n:6,obs:L<=27?7:8,min:7,max:12,bone:L>=28};
  const n=cfg.n;
  for(let tr=0;tr<2000;tr++){
    const s=rand(0,n*n-1),g=rand(0,n*n-1);if(s===g)continue;
    const sr=Math.floor(s/n),sc=s%n,gr=Math.floor(g/n),gc=g%n,man=Math.abs(sr-gr)+Math.abs(sc-gc);
    if(cfg.m==='straight'&&!((sr===gr||sc===gc)&&man>=2&&man<=3))continue;
    if(cfg.m==='bend'&&!(sr!==gr&&sc!==gc&&man>=3&&man<=5))continue;
    let bone=-1;if(cfg.bone){bone=rand(0,n*n-1);if(bone===s||bone===g)continue}
    const obs=new Set();let guard=0;while(obs.size<cfg.obs&&guard++<100){const x=rand(0,n*n-1);if(x!==s&&x!==g&&x!==bone)obs.add(x)}
    if(cfg.m)return{n,s,g,obs,bone};
    const d1=bfs(n,obs,s);
    let total;
    if(cfg.bone){const d2=bfs(n,obs,bone);total=d1[bone]+d2[g];if(d1[g]>=total)continue}else total=d1[g];
    if(total===Infinity||total<cfg.min||total>cfg.max)continue;
    if(!cfg.bone&&cfg.obs&&total===man&&Math.random()<.6)continue;
    return{n,s,g,obs,bone};
  }

}

    while(reg.size<k&&guard++<500){const [r,c]=pick([...reg]).split(',').map(Number);const [dr,dc]=pick([[0,1],[1,0],[0,-1],[-1,0]]);
      const nr=r+dr,nc=c+dc;if(nr>=0&&nc>=0&&nr<cfg.H&&nc<cfg.W)reg.add(nr+','+nc)}
    if(reg.size<k)continue;
    const cells=[...reg].map(s=>s.split(',').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const cover=new Set(),pieces=[];let it=0;
    const rec=()=>{if(++it>3000)return false;
      const f=cells.find(([r,c])=>!cover.has(r+','+c));
      if(!f)return pieces.length>=cfg.p[0]&&pieces.length<=cfg.p[1];
      if(pieces.length>=cfg.p[1])return false;
      for(const sh of shuffle(cfg.sh.slice()))for(const o of shuffle(porients(POLY[sh]))){
        const dr=f[0]-o[0][0],dc=f[1]-o[0][1],abs=o.map(([r,c])=>[r+dr,c+dc]);
        if(abs.every(([r,c])=>reg.has(r+','+c)&&!cover.has(r+','+c))){
          abs.forEach(([r,c])=>cover.add(r+','+c));pieces.push(abs);
          if(rec())return true;pieces.pop();abs.forEach(([r,c])=>cover.delete(r+','+c))}}
      return false};
    if(!rec())continue;
    const mr=Math.min(...cells.map(c=>c[0])),mc=Math.min(...cells.map(c=>c[1]));
    const H=Math.max(...cells.map(c=>c[0]))-mr+1,W=Math.max(...cells.map(c=>c[1]))-mc+1;
    const region=new Set(cells.map(([r,c])=>(r-mr)+','+(c-mc)));
    const cols=shuffle(PCOL.slice());
    const ps=shuffle(pieces.map((p,i)=>{let cs=pnorm(p);if(cfg.rot){const t=rand(1,3);for(let j=0;j<t;j++)cs=prot(cs)}return{id:i,cells:cs,color:cols[i%cols.length],at:null,sol:[Math.min(...p.map(c=>c[0]))-mr,Math.min(...p.map(c=>c[1]))-mc]}}));
    return{W,H,region,pieces:ps,rot:cfg.rot};
  }
  return null;
}
function shapeRound(L){

      let best=p.cells[0],bd=1e9;p.cells.forEach(([r,c])=>{const d=Math.abs(r-gr)+Math.abs(c-gc);if(d<bd){bd=d;best=[r,c]}});

/* ---------- 12. Clock ---------- */
function clockSVG(h,m){
  let nums='';for(let i=1;i<=12;i++){const a=i*Math.PI/6;nums+=`<text x="${(50+36*Math.sin(a)).toFixed(1)}" y="${(50-36*Math.cos(a)+4.5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="bold" fill="${INK}" font-family="Arial Rounded MT Bold,Arial,sans-serif">${i}</text>`}
  let ticks='';for(let i=0;i<12;i++)ticks+=`<line x1="50" y1="5" x2="50" y2="9" stroke="#D8C7B0" stroke-width="2" transform="rotate(${i*30} 50 50)"/>`;
  const ha=((h%12)+m/60)*30,ma=m*6;
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#F5C451" stroke-width="4"/>${ticks}${nums}
  <line x1="50" y1="50" x2="50" y2="27" stroke="${INK}" stroke-width="5.5" stroke-linecap="round" transform="rotate(${ha} 50 50)"/>
  <line x1="50" y1="50" x2="50" y2="13" stroke="#E07A2E" stroke-width="3.5" stroke-linecap="round" transform="rotate(${ma} 50 50)"/><circle cx="50" cy="50" r="4" fill="${INK}"/></svg>`;
}
const wrapH=x=>((x-1+120)%12)+1;
const tfmt=(h,m)=>`${h}:${m?'30':'00'}`;
const tsay=(h,m)=>m?`half past ${h}`:`${h} o'clock`;
function genClock(L){
  let h=rand(1,12),m=0,mode='read',delta=0;
  if(L<=6){}
  else if(L<=12)m=pick([0,30]);
  else if(L<=18){mode='match';m=pick([0,30])}
  else if(L<=24){mode='set';m=L<=21?0:pick([0,30])}
  else{mode='later';m=pick([0,30]);delta=L<=27?60:pick([120,30,60])}
  let ans=[h,m],opts;
  if(mode==='later'){const t=h*60+m+delta;ans=[wrapH(Math.floor(t/60)),t%60]}
  const [ah,am]=ans;
  const cand=[[wrapH(ah+1),am],[wrapH(ah-1),am],[ah,am?0:30],[wrapH(ah+2),am]];
  if(mode==='read'&&L<=6)opts=shuffle([[ah,0],...shuffle([[wrapH(ah+1),0],[wrapH(ah-1),0],[wrapH(ah+3),0],[wrapH(ah-2),0]]).slice(0,2)]);
  else{const s=new Map();shuffle(cand).forEach(c=>{const k=tfmt(...c);if(k!==tfmt(ah,am)&&s.size<2)s.set(k,c)});opts=shuffle([[ah,am],...s.values()])}
  return{mode,h,m,ans,opts,delta};
}
function clockRound(L){
  const q=genClock(L),host=svgAnimal('cat'),eq=(a,b)=>a[0]===b[0]&&a[1]===b[1];
  const finish=b=>{$('#ans').querySelectorAll('button').forEach(x=>x.disabled=true);roundDone($('#host'),`It is ${tsay(...q.ans)}!`)};
  const wrong=b=>{b.classList.add('used');wiggleEl(b);sfx.soft();react($('#host'),'think');say('Look at the short hand and the long hand!')};
  if(q.mode==='read'||q.mode==='later'){
    const later_=q.mode==='later',dw=q.delta===30?'half an hour':q.delta===60?'1 hour':'2 hours';
    stage().innerHTML=`${bubbleScene(host,later_?`${dw} later?`:'What time is it?')}<div class="bigclock">${clockSVG(q.h,q.m)}</div>
    <div class="answers" id="ans">${q.opts.map((o,i)=>`<button class="big num" data-i="${i}">${tfmt(...o)}</button>`).join('')}</div>`;
    say(later_?`It is ${tsay(q.h,q.m)}. What time is it ${dw} later?`:'What time is it?');
    $('#ans').querySelectorAll('button').forEach(b=>b.onclick=()=>eq(q.opts[+b.dataset.i],q.ans)?finish(b):wrong(b));
    return;
  }
  if(q.mode==='match'){
    stage().innerHTML=`${bubbleScene(host,`<b>${tfmt(...q.ans)}</b>`)}<div class="prompt">Which clock?</div>
    <div class="answers" id="ans">${q.opts.map((o,i)=>`<button class="cbtn" data-i="${i}">${clockSVG(...o)}</button>`).join('')}</div>`;
    say(`Find ${tsay(...q.ans)}!`);
    $('#ans').querySelectorAll('button').forEach(b=>b.onclick=()=>eq(q.opts[+b.dataset.i],q.ans)?finish(b):wrong(b));
    return;
  }
  let ch=wrapH(q.ans[0]+pick([-4,-3,-2,2,3,4,5])),cm=pick([0,30]),tries=0,over=false;
  stage().innerHTML=`${bubbleScene(host,`Set <b>${tfmt(...q.ans)}</b>`)}<div class="bigclock" id="bc"></div>
  <div class="ctrl"><div class="cgrp"><button class="big sm" id="hm">−</button><span class="clab">short</span><button class="big sm" id="hp2">+</button></div>
  <div class="cgrp"><button class="big sm" id="mt">↻</button><span class="clab">long</span></div><button class="big yes" id="done">Done ✓</button></div>
  <div class="answers" id="ans"></div>`;
  const draw=()=>{$('#bc').innerHTML=clockSVG(ch,cm)};draw();
  say(`Make the clock say ${tsay(...q.ans)}!`);
  $('#hm').onclick=()=>{if(over)return;ch=wrapH(ch-1);sfx.pop();draw()};
  $('#hp2').onclick=()=>{if(over)return;ch=wrapH(ch+1);sfx.pop();draw()};
  $('#mt').onclick=()=>{if(over)return;cm=cm?0:30;sfx.pop();draw()};
  $('#done').onclick=()=>{if(over)return;
    if(ch===q.ans[0]&&cm===q.ans[1]){over=true;roundDone($('#host'),`It is ${tsay(...q.ans)}!`)}
    else{tries++;sfx.soft();react($('#host'),'think');
      say(cm!==q.ans[1]?(q.ans[1]?'The long hand points to 6 for half past.':'The long hand points to 12 for o\'clock.'):`The short hand points to ${q.ans[0]}.`)}};
}

const SNACKS=[['🍪','cookies'],['🍓','strawberries'],['🍬','candies'],['🥟','dumplings'],['🍩','donuts']];
function genShare(L){
  let n,each,left=0;

  else if(L<=12){n=3;each=rand(1,4)}
  else if(L<=18){n=4;each=rand(1,4)}
  else if(L<=24){n=pick([2,3,4]);each=rand(2,5)}
  else{n=pick([2,3,4]);each=rand(1,4);left=rand(1,n-1)}
  return{n,each,left,total:n*each+left,ask:L>=19&&L<=24,snack:pick(SNACKS),animals:shuffle(ALL4.slice()).slice(0,n)};

function shareRound(L){
  const q=genShare(L),sn=q.snack[0];

  <div class="pile" id="pile"></div>
  <div class="plates">${q.animals.map((k,i)=>`<button class="plate" data-i="${i}" style="background:${A[k].tint}"><div class="phost">${svgAnimal(k,{orange:k==='capy'})}</div><div class="pfood" id="pf${i}"></div></button>`).join('')}</div>

  const draw=()=>{

    got.forEach((g,i)=>{$('#pf'+i).innerHTML=Array(g).fill(`<span class="snack sm">${sn}</span>`).join('')})};
  draw();
  if(q.ask){
    const opts=numOpts(q.each,[q.each+1,q.each-1,q.each+2],1);
    $('#ans').innerHTML=opts.map(v=>`<button class="big num" data-v="${v}">${v}</button>`).join('');

  if(q.left)$('#ans').innerHTML='<button class="big yes" id="done">Done ✓</button>';
  const check=final=>{
    const eq=got.every(g=>g===got[0]);

/* ---------- 14. Memory Match ---------- */
const dotsMini=n=>`<div class="mdots">${Array(n).fill('<i></i>').join('')}</div>`;
function genMemory(L){
  const vals=(n,lo,hi)=>shuffle(Array.from({length:hi-lo+1},(_,i)=>lo+i)).slice(0,n);
  let pairs,make10=false;
  if(L<=5)pairs=vals(3,1,5).map(v=>[`<b>${v}</b>`,dotsMini(v)]);
  else if(L<=10)pairs=vals(4,1,10).map(v=>[`<b>${v}</b>`,dotsMini(v)]);
  else if(L<=15)pairs=vals(5,1,10).map(v=>[`<b>${v}</b>`,dotsMini(v)]);
  else if(L<=20)pairs=vals(4,3,10).map(v=>{const a=rand(1,v-1);return[`<b>${v}</b>`,`<b>${a}+${v-a}</b>`]});
  else if(L<=25){make10=true;pairs=shuffle([1,2,3,4,5]).slice(0,L<=22?4:5).map(a=>[`<b>${a}</b>`,`<b>${10-a}</b>`])}
  else pairs=vals(6,4,18).map(v=>{if(Math.random()<.6){const a=rand(Math.max(1,v-9),Math.min(9,v-1));return[`<b>${v}</b>`,`<b>${a}+${v-a}</b>`]}const b=rand(1,9);return[`<b>${v}</b>`,`<b>${v+b}−${b}</b>`]});
  return{cards:shuffle(pairs.flatMap((p,i)=>[{id:i,h:p[0]},{id:i,h:p[1]}])),make10};
}
function memoryRound(L){
  const q=genMemory(L),n=q.cards.length,cols=n<=6?3:n===10?5:4,tok=session.tok;
  const cw=Math.floor(Math.max(80,Math.min(140,(window.innerWidth-60)/cols-12,(window.innerHeight-260)/Math.ceil(n/cols)-12)));
  stage().style.setProperty('--mc',cw+'px');
  stage().innerHTML=`<div class="bubble notail" id="bub">${q.make10?'Make 10!':'Find the pairs!'}</div>
  <div class="mgrid" style="grid-template-columns:repeat(${cols},var(--mc))">${q.cards.map((c,i)=>`<button class="mcard" data-i="${i}"><div class="mback">?</div><div class="mface">${c.h}</div></button>`).join('')}</div>`;
  say(q.make10?'Find two numbers that make 10!':'Flip two cards. Find the pairs that match!');
  let open=[],busy=false,done=0;
  stage().querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    if(busy||b.classList.contains('up'))return;
    b.classList.add('up');sfx.pop();open.push(b);

    const [x,y]=open;open=[];

    }else{busy=true;sfx.soft();setTimeout(()=>{if(!alive(tok))return;x.classList.remove('up');y.classList.remove('up');busy=false},1000)}
  });
}

/* ---------- 15. Measure It ---------- */
function genMeasure(L){
  if(L<=8){const a=rand(2,9);let b;do{b=rand(2,9)}while(Math.abs(a-b)<(L<=4?2:1));
    return{mode:'cmp',lens:[a,b],ask:pick(['longer','shorter']),off:L>=6?[rand(0,3),rand(0,3)]:[0,0]}}
  if(L<=16){const n=rand(2,10);return{mode:'count',n,cubes:L<=12,opts:numOpts(n,[n+1,n-1,n+2],1)}}
  if(L<=24){const k=L<=20?3:4;return{mode:'order',lens:shuffle(Array.from({length:9},(_,i)=>i+2)).slice(0,k)}}
  const a=rand(3,10),b=rand(2,a-1);return{mode:'diff',lens:shuffle([a,b]),d:a-b,opts:numOpts(a-b,[a-b+1,a-b-1,a],1)};
}

  const q=genMeasure(L),u=Math.floor(Math.max(26,Math.min(56,(window.innerWidth-120)/13)));

  const host=svgAnimal('bunny');
  if(q.mode==='cmp'){

/* ---------- 16. Odd One Out ---------- */
const CATS={fruit:['🍎','🍌','🍓','🍇','🍊','🍉','🍐','🍒'],ride:['🚗','🚌','🚲','✈️','🚂','🚀','🚁','⛵'],animal:['🐶','🐱','🐰','🐵','🐷','🐮','🐯','🐼'],
  wear:['👕','👖','👗','🧢','🧦','👟','🧤','🧣'],sea:['🐟','🐙','🦀','🐳','🐬','🦈'],sky:['☀️','🌙','⭐','☁️','🌈']};
const CATNAME={fruit:'fruits',ride:'things that go',animal:'animals',wear:'clothes',sea:'sea animals',sky:'things in the sky'};
function genOdd(L){
  let items,odd,why;
  if(L<=8){const ss=shuffle(['circle','square','triangle','star']),cs=shuffle(Object.keys(COL));
    if(L<=4){items=[0,1,2].map(()=>shapeSVG(ss[0],cs[0]));odd=shapeSVG(ss[0],cs[1]);why='It is a different color!'}
    else{items=[0,1,2].map(()=>shapeSVG(ss[0],cs[0]));odd=shapeSVG(ss[1],cs[0]);why='It is a different shape!'}}
  else if(L<=16){let c1,c2;do{[c1,c2]=shuffle(Object.keys(CATS))}while((c1==='animal'&&c2==='sea')||(c1==='sea'&&c2==='animal'));
    items=shuffle(CATS[c1].slice()).slice(0,3).map(e=>emo(e));odd=emo(pick(CATS[c2]));why=`The others are ${CATNAME[c1]}!`}
  else if(L<=24){const v=rand(3,8);let w;do{w=rand(2,9)}while(w===v);
    const forms=x=>[`<b class="onum">${x}</b>`,dotsMini(x),(()=>{const a=rand(1,x-1);return `<b class="onum">${a}+${x-a}</b>`})()];
    items=forms(v);odd=pick(forms(w));why=`The others are all ${v}!`}
  else{const ss=shuffle(['circle','square','triangle','star']),cs=shuffle(Object.keys(COL));
    if(Math.random()<.5){items=[0,1,2].map(i=>shapeSVG(ss[i],cs[0]));odd=shapeSVG(ss[3],cs[1]);why='The others are all the same color!'}
    else{items=[0,1,2].map(i=>shapeSVG(ss[0],cs[i]));odd=shapeSVG(ss[1],cs[3]);why='The others are all the same shape!'}}
  const all=items.concat([odd]),order=shuffle([0,1,2,3]);
  return{cells:order.map(i=>all[i]),ans:order.indexOf(3),why};
}
function oddRound(L){
  const q=genOdd(L);
  stage().innerHTML=`${bubbleScene(svgAnimal('capy',{orange:true}),'Which one is different?')}
  <div class="oddgrid">${q.cells.map((h,i)=>`<button class="oddc" data-i="${i}">${h}</button>`).join('')}</div>`;
  say('Which one is different?');let over=false;
  stage().querySelectorAll('.oddc').forEach(b=>b.onclick=()=>{if(over)return;
    if(+b.dataset.i===q.ans){over=true;b.classList.add('win');roundDone($('#host'),q.why)}
    else{b.classList.add('used');wiggleEl(b);sfx.soft();say('Look again! Which one does not belong?')}});
}

/* ---------- 17. Mirror Picture ---------- */
const MCOL=['#FF6B6B','#4D96FF','#FFC93C'];
function genMirror(L){
  let half,H,colors,k;
  if(L<=8){half=2;H=4;colors=1;k=rand(2,4)}
  else if(L<=16){half=3;H=5;colors=1;k=rand(4,7)}
  else if(L<=24){half=3;H=5;colors=2;k=rand(5,8)}
  else{half=4;H=6;colors=pick([2,3]);k=rand(8,12)}
  const left=new Map(),cells=shuffle(Array.from({length:H*half},(_,i)=>i)).slice(0,k);
  cells.forEach((c,i)=>left.set(Math.floor(c/half)+','+(c%half),i<colors?i:rand(0,colors-1)));
  return{half,H,colors,left};
}
function mirrorRound(L){
  const q=genMirror(L),W=q.half*2;
  const cs=Math.floor(Math.max(40,Math.min(76,(window.innerWidth-80)/W,(window.innerHeight-440)/q.H)));
  stage().style.setProperty('--ms',cs+'px');
  const right=new Map();let col=0,over=false;
  stage().innerHTML=`${bubbleScene(svgAnimal('cat'),'Make it the same!')}
  <div class="mirgrid" id="mg" style="grid-template-columns:repeat(${W},var(--ms))"></div>
  ${q.colors>1?`<div class="mpal">${MCOL.slice(0,q.colors).map((c,i)=>`<button class="mpc ${i===0?'on':''}" data-c="${i}" style="background:${c}"></button>`).join('')}</div>`:''}
  <button class="big" id="chk">Check 👀</button>`;
  say('This is a mirror. Color the other side the same way!');
  const target=(r,c)=>{const lc=W-1-c;return q.left.has(r+','+lc)?q.left.get(r+','+lc):-1};
  const draw=(bad)=>{let h='';
    for(let r=0;r<q.H;r++)for(let c=0;c<W;c++){
      const isL=c<q.half,v=isL?(q.left.has(r+','+c)?q.left.get(r+','+c):-1):(right.has(r+','+c)?right.get(r+','+c):-1);
      h+=`<div class="mcell ${isL?'lft':'rgt'} ${c===q.half-1?'edge':''} ${bad&&bad.has(r+','+c)?'shake':''}" data-r="${r}" data-c="${c}" style="${v>=0?`background:${MCOL[v]}`:''}"></div>`}
    $('#mg').innerHTML=h};
  draw();
  const solved=()=>{for(let r=0;r<q.H;r++)for(let c=q.half;c<W;c++){const t=target(r,c),v=right.has(r+','+c)?right.get(r+','+c):-1;if(t!==v)return false}return true};
  $('#mg').onclick=e=>{if(over)return;const el=e.target.closest('.mcell.rgt');if(!el)return;const k=el.dataset.r+','+el.dataset.c;
    if(right.has(k)&&right.get(k)===col)right.delete(k);else right.set(k,col);sfx.pop();draw();
    if(solved()){over=true;$('#mg').classList.add('done');roundDone($('#host'),'It looks like a mirror!')}};
  stage().querySelectorAll('.mpc').forEach(b=>b.onclick=()=>{col=+b.dataset.c;stage().querySelectorAll('.mpc').forEach(x=>x.classList.toggle('on',x===b));sfx.pop()});
  $('#chk').onclick=()=>{if(over)return;const bad=new Set();
    for(let r=0;r<q.H;r++)for(let c=q.half;c<W;c++){const k=r+','+c;if(right.has(k)&&right.get(k)!==target(r,c))bad.add(k)}
    sfx.soft();draw(bad);say(bad.size?'Some boxes are not right. Look at the other side!':'Keep going! Some boxes are still empty.')};
}

/* ---------- 18. Number Order ---------- */
function genOrder(L){
  let nums,desc=false;
  if(L<=6){const s=rand(1,7);nums=[0,1,2,3].map(i=>s+i)}
  else if(L<=12){const s=rand(1,16);nums=[0,1,2,3,4].map(i=>s+i)}
  else if(L<=18)nums=shuffle(Array.from({length:20},(_,i)=>i+1)).slice(0,5);
  else if(L<=24){const d=pick([2,5,10]),s=d*rand(0,d===10?5:3);nums=[0,1,2,3,4].map(i=>s+d*i)}
  else{desc=L>=28;nums=shuffle(Array.from({length:90},(_,i)=>i+10)).slice(0,5)}
  return{cards:shuffle(nums.slice()),sorted:nums.slice().sort((a,b)=>desc?b-a:a-b),desc};
}
function orderRound(L){
  const q=genOrder(L),n=q.cards.length;
  stage().innerHTML=`${bubbleScene(svgAnimal('bunny'),q.desc?'Big ➜ small':'Small ➜ big')}
  <div class="oslots">${Array.from({length:n},(_,i)=>`<div class="oslot" id="os${i}"></div>`).join('')}</div>
  <div class="ocards">${q.cards.map((v,i)=>`<button class="ocard" data-v="${v}">${v}</button>`).join('')}</div>`;
  say(q.desc?'Put the numbers in order, from big to small!':'Put the numbers in order, from small to big!');
  let k=0,over=false;
  stage().querySelectorAll('.ocard').forEach(b=>b.onclick=()=>{if(over)return;
    if(+b.dataset.v===q.sorted[k]){$('#os'+k).textContent=b.dataset.v;$('#os'+k).classList.add('full');b.style.visibility='hidden';sfx.pop();speak(b.dataset.v,true);k++;
      if(k===n){over=true;roundDone($('#host'),q.sorted.join(', ')+'!')}}
    else{wiggleEl(b);sfx.soft();say(q.desc?(k?'Which one is next?':'Find the biggest number!'):(k?'Which one is next?':'Find the smallest number!'))}});
}

const isZh=()=>vset.lang==='zh';
function zh(t){
  if(t==null)return t;let s=String(t);
  const tr=s.trim();if(ZHEXACT[tr])return s.replace(tr,ZHEXACT[tr]);
  for(const [a,b] of ZHR){if(typeof a==='string'){if(s.includes(a))s=s.split(a).join(b)}else s=s.replace(a,b)}
  return s;
}
/* translate visible text when in Chinese */
function zhDOM(root){
  if(!isZh()||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const v=n.nodeValue;if(!v||!/[A-Za-z]/.test(v))return;if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('svg,.coin,.vrow,.notr'))return;const z=zh(v);if(z!==v)n.nodeValue=z});
}
new MutationObserver(ms=>{if(!isZh())return;ms.forEach(m=>{m.addedNodes.forEach(n=>{if(n.nodeType===3){if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('.notr,svg'))return;const z=zh(n.nodeValue);if(z!==n.nodeValue)n.nodeValue=z}else if(n.nodeType===1)zhDOM(n)})})}).observe(app,{childList:true,subtree:true});

/* speech: language-aware */
function langVoices(){
  try{const all=speechSynthesis.getVoices();
    if(!isZh())return englishVoices();
    const sc=v=>(/^zh[-_](TW|Hant)/i.test(v.lang)?10:/^zh[-_]HK/i.test(v.lang)?3:/^zh/i.test(v.lang)?2:0)+(/premium|enhanced|natural|online|進階|強化/i.test(v.name)?20:0)+(/Mei|美佳|國語|Hsiao|Yating|Hanhan|Yun/i.test(v.name)?5:0);
    return all.filter(v=>/^(zh|cmn)/i.test(v.lang)).sort((a,b)=>sc(b)-sc(a))}catch(e){return []}
}
getVoice=function(){
  try{if(voice)return voice;const vs=langVoices(),uri=isZh()?vset.uriZh:vset.uri;
    voice=(uri&&vs.find(v=>v.voiceURI===uri))||vs[0]||null;return voice}catch(e){return null}
};
speak=function(t,cancel){
  try{const s=window.speechSynthesis;if(!s)return;if(cancel)s.cancel();
    const u=new SpeechSynthesisUtterance(isZh()?zh(t):t);u.lang=isZh()?'zh-TW':'en-US';u.rate=vset.rate;u.pitch=1;
    const v=getVoice();if(v){u.voice=v;u.lang=v.lang}s.speak(u)}catch(e){}
};

const _soft=sfx.soft;
sfx.soft=function(){_soft();if(session)session.miss=(session.miss||0)+1;const g=curGame();if(!g)return;const s=stat(g);s.miss++;
  s.log.unshift({t:Date.now(),L:session.subL||session.L,q:(session.qtext||'').slice(0,160)});s.log=s.log.slice(0,20);saveStats()};

function wrapRounds(){for(const id in GAMES){const g=GAMES[id];if(g._w)continue;const orig=g.round;g._w=true;
  g.round=function(L,r){if(id!=='daily'&&session&&session.id!=='daily'){session.sub=null}orig(L,r);if(session&&id!=='daily')session.qtext=lastLine}}}

function nfreq(n){const m=n.match(/^([A-G])([#b]?)(\d)$/);const k=NOTEIDX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,(12*(+m[3]+1)+k-69)/12)}
function parseSeq(s){const ev=[];let t=0;s.split(/\s+/).forEach(tok=>{if(!tok||tok==='|')return;const [n,d]=tok.split('-');const du=d?+d:1;if(n!=='r')ev.push({t,d:du,f:nfreq(n)});t+=du});return{ev,len:t}}

const Music={playing:false,gain:null,timer:null,cur:null,loopStart:0,loops:0,last:-1,duckF:1,_nb:null,
  ctx(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx},
  vol(){return (vset.musicOn?vset.musicVol:0)*this.duckF},
  setVol(){if(this.gain){try{this.gain.gain.setTargetAtTime(Math.max(.0001,this.vol()),this.ctx().currentTime,.12)}catch(e){}}},
  duck(on){this.duckF=on?.35:1;this.setVol()},
  pick(){let i;do{i=rand(0,TRACKS.length-1)}while(TRACKS.length>1&&i===this.last);this.last=i;const t=TRACKS[i];
    t.p=t.p||{mel:parseSeq(t.mel),bass:parseSeq(t.bass)};this.cur=t;this.loops=0;const el=document.getElementById('nowPlaying');if(el)el.textContent=t.name},
  start(){
    if(this.playing||!vset.musicOn||vset.musicVol<=0)return;
    try{const c=this.ctx();if(c.state==='suspended')c.resume();
      this.gain=c.createGain();this.gain.gain.value=Math.max(.0001,this.vol());this.gain.connect(c.destination);
      this.playing=true;this.pick();this.loopStart=c.currentTime+.15;this.schedule(this.loopStart);
      this.timer=setInterval(()=>this.tick(),200)}catch(e){this.playing=false}
  },
  stop(){this.playing=false;clearInterval(this.timer);if(this.gain){try{this.gain.disconnect()}catch(e){}this.gain=null}
    const el=document.getElementById('nowPlaying');if(el)el.textContent='—'},
  next(){this.stop();this.start()},
  dur(){return this.cur.p.mel.len*30/this.cur.bpm},
  tick(){if(!this.playing)return;const c=this.ctx();
    if(c.currentTime>this.loopStart+this.dur()-.6){this.loopStart+=this.dur();this.loops++;if(this.loops>=6)this.pick();this.schedule(this.loopStart)}},
  schedule(t0){
    const tr=this.cur,e=30/tr.bpm,mv=tr.wave==='square'?.05:.11;
    tr.p.mel.ev.forEach(n=>this.note(t0+n.t*e,n.d*e,n.f,tr.wave,mv));
    tr.p.bass.ev.forEach(n=>this.note(t0+n.t*e,n.d*e,n.f,'triangle',.16));
    const bars=Math.round(tr.p.mel.len/8);
    for(let b=0;b<bars;b++)for(let i=0;i<8;i++){const ch=tr.drum[i];if(ch&&ch!=='.')this.drum(t0+(b*8+i)*e,ch)}
  },
  note(t,d,f,w,v){const c=this.ctx(),o=c.createOscillator(),g=c.createGain();o.type=w;o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.08,d*.9));
    o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+d+.05)},
  noise(){if(!this._nb){const c=this.ctx(),b=c.createBuffer(1,Math.floor(c.sampleRate*.3),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this._nb=b}return this._nb},
  drum(t,ch){const c=this.ctx();
    if(ch==='k'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
      g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+.16);return}
    const s=c.createBufferSource();s.buffer=this.noise();const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=ch==='s'?1500:7000;
    const g=c.createGain(),v=ch==='s'?.12:.04,dd=ch==='s'?.12:.04;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dd);
    s.connect(f);f.connect(g);g.connect(this.gain);s.start(t);s.stop(t+dd+.02)}
};
