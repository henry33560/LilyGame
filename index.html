<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Lily 遊樂園">
<title>Lily 遊樂園</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff8ef;color:#4a3b30;
  font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
h1{margin:0;font-size:48px;letter-spacing:3px;display:flex;align-items:center;gap:16px}
h1 svg{width:110px;height:auto;animation:wiggle 3s infinite}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-6deg)}96%{transform:rotate(6deg)}}
.games{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.game{width:300px;height:260px;border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.08);text-decoration:none;color:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.game:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.ico{font-size:70px;line-height:1}
.big{font-size:54px;font-weight:800;letter-spacing:4px;line-height:1}
.name{font-size:28px;font-weight:700}
.sub{font-size:18px;color:#8a7768}
.math{background:#fff1dc} .type{background:#e7f2ff} .piano{background:#f1eaff} .dress{background:#ffe6ef}
.games{max-width:680px}
</style>
</head>
<body>
<main>
  <h1><svg viewBox="0 0 130 100" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="70" cy="62" rx="50" ry="30" fill="#b07a4f"/>
<rect x="38" y="78" width="12" height="16" rx="6" fill="#8f5f3b"/><rect x="92" y="78" width="12" height="16" rx="6" fill="#8f5f3b"/>
<ellipse cx="40" cy="46" rx="30" ry="25" fill="#bf8a5c"/>
<rect x="8" y="38" width="38" height="28" rx="14" fill="#a8744b"/>
<ellipse cx="54" cy="24" rx="7" ry="6" fill="#8a5a36"/>
<circle cx="38" cy="40" r="3.6" fill="#3a2a1e"/><circle cx="39.2" cy="38.8" r="1.2" fill="#fff"/>
<ellipse cx="14" cy="47" rx="2.4" ry="1.8" fill="#3a2a1e"/>
<ellipse cx="46" cy="54" rx="6" ry="3.5" fill="#f5a3a3" opacity=".7"/>
<path d="M16 58 q6 4 12 0" stroke="#3a2a1e" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="64" cy="20" r="9" fill="#ffb3c7"/><circle cx="64" cy="20" r="4" fill="#ff7aa2"/>
</svg>Lily 遊樂園</h1>
  <div class="games">
    <a class="game math" href="math.html">
      <div class="ico">🔢🧩</div>
      <div class="name">數學益智</div>
      <div class="sub">Animal Math Park</div>
    </a>
    <a class="game type" href="typing.html">
      <div class="big"><span style="color:#4f8fd0">ㄅ</span><span style="color:#e0628f">a</span></div>
      <div class="name">打字樂園</div>
      <div class="sub">注音・English</div>
    </a>
    <a class="game piano" href="piano.html">
      <div class="ico">🎹🎵</div>
      <div class="name">鋼琴</div>
      <div class="sub">Piano Star</div>
    </a>
    <a class="game dress" href="dressing.html">
      <div class="ico">👗👑</div>
      <div class="name">裝扮</div>
      <div class="sub">Dress Up Missions</div>
    </a>
  </div>
</main>
</body>
</html>
